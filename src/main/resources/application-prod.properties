# ============================================
# 生产环境配置
# ============================================

# 关闭 DevTools
spring.devtools.restart.enabled=false

# ============================================
# 阶段三 3.5：密钥外置（**不提供默认值**）
# ============================================
# application.properties 里这两个是 `${DB_PASSWORD:114514}` / `${JWT_SECRET:...}` ——
# 带默认值的好处是本地开发零配置，坏处是**生产忘记配置时会静默用上开发默认值**，
# 属于安全事故隐患（默认密码进了生产库）。
#
# 这里在生产 profile 覆盖为"无默认值"版本：
#   - 显式提供 DB_PASSWORD / JWT_SECRET 环境变量 → 正常启动
#   - 忘记提供 → 启动直接失败并提示占位符无法解析（fail-fast，比静默用错配置好）
#
# 本地开发用 dev profile（application.properties 的默认值生效），不受影响。
# docker-compose.yml 里已为 app 容器传入这两个变量。
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}

# MyBatis SQL 日志
# 阶段一修正：原先用 NoLoggingImpl 会让 SQL 完全不记录，生产出问题无法排查慢 SQL。
# 改为不指定 log-impl（MyBatis 自动走 SLF4J），由下面的 logging.level 控制输出量：
#   warn = 只在慢 SQL/异常时才可能输出（正常 SELECT 不打印）
# 如需临时排查慢 SQL：改为 info/debug 并配合 logback 的 com.loan.mapper logger。
logging.level.com.loan.mapper=warn
logging.level.org.mybatis=warn

# 日志文件与滚动策略
# 注意：本项目已提供 src/main/resources/logback-spring.xml（阶段一 1.1），
# 一旦存在自定义 logback 配置，以下 Spring Boot 默认日志项会被**忽略**：
#   logging.file.name / logging.pattern.* / logging.logback.rollingpolicy.*
# 因此实际生效的是 logback-spring.xml 中的：
#   文件路径 ${LOG_HOME:-./logs}/loan.log（生产可用 -DLOG_HOME=/var/log/loan 覆盖）
#   滚动策略 按天 + 50MB，保留 15 天，总量 2GB
# 保留这些属性仅作为"未使用自定义 logback 时的兜底说明"，不再依赖它们。

# （可选）生产环境关闭 Swagger 文档
# springdoc.api-docs.enabled=false
# springdoc.swagger-ui.enabled=false

# 数据库连接池优化（如果使用 HikariCP）
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
