# ============================================
# 开发环境配置
# ============================================

# DevTools 热重启
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

# MyBatis SQL 日志
# 阶段一 1.2/1.3 修正：原先用 StdOutImpl —— MyBatis 会直接 System.out 打印 SQL，
# 完全绕过 SLF4J/logback，导致 SQL 日志永远进不了 logs/loan.log，也不带 traceId。
# 删掉该配置后，MyBatis 自动探测到 SLF4J，SQL 日志走 logback（受下面的 logging.level 控制）。
# 需要看 SQL 时把 com.loan.mapper 临时改为 debug 即可。

# 日志级别（注意：这些会覆盖 logback-spring.xml 中同名 logger 的级别）
# 排查 SQL 时把 com.loan.mapper 改为 debug
logging.level.com.loan.mapper=info
logging.level.org.mybatis=info

# 文件上传目录（相对于项目根目录）
app.file.upload-dir=uploads