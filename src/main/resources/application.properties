spring.application.name=loan

# 激活的配置文件（默认 dev，生产环境通过环境变量覆盖）
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=8080
server.servlet.context-path=/


spring.datasource.url=jdbc:mysql://localhost:3306/loan_risk_control?allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:114514}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.loan.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ============================================
# 阶段三 3.2：Flyway 数据库版本化
# ============================================
# 脚本位置：src/main/resources/db/migration/
#   V1__baseline_schema.sql    终态建表（31 张表，由现有库 dump 得出，顺序天然正确）
#   R__seed_config_data.sql    配置类种子（规则 19 条 + 产品 3 个 + 定价档位 5 档）
#                              R__ 前缀 = 可重复执行，内容变化时自动重跑（用 REPLACE INTO）
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 已有库（本机开发库已跑过历史脚本）→ 标记为"已在 V1"，不重复建表
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# 迁移脚本被改动过（checksum 不匹配）时报错，而不是静默跳过
spring.flyway.validate-on-migrate=true
# 允许乱序执行（团队并行开发时有用；单人开发也可关掉）
spring.flyway.out-of-order=false


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.packages-to-scan=com.loan.controller

# ============================================
# AI 客服（Python + LangChain 服务）
# ============================================
# Python 服务地址（独立进程，默认 8000；生产建议只监听 127.0.0.1）
cs.ai.base-url=${CS_AI_BASE_URL:http://127.0.0.1:8000}
# 服务间共享令牌：必须与 ai_service/.env 的 CS_SERVICE_TOKEN 一致。
# /internal/cs/** 在 SecurityConfig 里是 permitAll，靠这个令牌兜准入。
cs.ai.service-token=${CS_SERVICE_TOKEN:dev-token-change-me}
cs.ai.connect-timeout-ms=3000
# 流式场景下这是"两个 token 之间"的最长等待；首次工具调用+推理可能较久，故放宽到 60s
cs.ai.read-timeout-ms=60000


jwt.secret=${JWT_SECRET:loan_system_springboot40_secret_2024}
jwt.expiration=7200000


# 影子评分采样比例（W5-A5）：0=关闭（默认） 1=全量 (0,1)=按比例采样
shadow.rate=0


logging.level.com.loan=info
logging.level.org.springframework.web=warn

# ============================================
# 阶段一 1.4：可观测性（Actuator + Prometheus）
# ============================================
# 暴露端点：生产建议只开 health / info / prometheus（不暴露 env、beans、heapdump 等敏感端点）
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# 健康检查显示各组件明细（db / redis / diskSpace），排查时能直接看出哪一块坏了
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
# 全局标签：将来多实例/多环境下便于区分指标来源
management.metrics.tags.application=${spring.application.name:loan}

# ============================================
# 阶段二 2.2b：Redis 缓存
# ============================================
# 缓存实现选 Redis（依赖已存在，/actuator/health 中 redis 为 UP）
spring.cache.type=redis
# 默认 TTL 5 分钟；规则/档位变更时会主动 evict，不依赖过期
spring.cache.redis.time-to-live=300s
# 缓存空结果，防"查不到→每次重查"的穿透
spring.cache.redis.cache-null-values=true
# key 前缀，与其它应用共用 Redis 实例时避免冲突
spring.cache.redis.key-prefix=loan:
spring.cache.redis.use-key-prefix=true


# ============================================
# 逾期罚息（逾期处理功能升级 第 3 步）
# ============================================
# 计算方式：当期应还 × 基础日罚息率 × 等级倍数 × 逾期天数（单利，不复利）
# 默认 0.0005（万分之五/天，年化约 18%）；M2/M3 倍数递增体现"越拖越贵"
# ⚠️ 罚息率属监管敏感参数，上线前需按实际业务口径确认
overdue.penalty.daily-rate=${OVERDUE_PENALTY_DAILY_RATE:0.0005}
overdue.penalty.multiplier.m1=${OVERDUE_PENALTY_MULTIPLIER_M1:1}
overdue.penalty.multiplier.m2=${OVERDUE_PENALTY_MULTIPLIER_M2:1.5}
overdue.penalty.multiplier.m3=${OVERDUE_PENALTY_MULTIPLIER_M3:3}