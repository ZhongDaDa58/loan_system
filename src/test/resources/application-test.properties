# =============================================================================
# 测试环境配置（阶段三 3.3）
# =============================================================================
# 使用方式：测试类上标注 @ActiveProfiles("test")
#
# 说明：
#   1) 数据源：集成测试会用 Testcontainers 的 @DynamicPropertySource 覆盖，
#      这里只是兜底（纯单测不连库，用不到）。
#   2) Redis：测试环境改 simple（内存），避免依赖真实 Redis 服务。
#      ⚠️ 这一步很关键 —— 否则 @Cacheable 会尝试连 Redis，测试环境不一定有。
#   3) Flyway：测试环境关闭。迁移脚本由独立的「空库全量建表」场景验证，
#      集成测试用 @DynamicPropertySource 临时建表更快。
# =============================================================================

spring.cache.type=simple
# Testcontainers 每轮起全新 MySQL 容器，Flyway 从 V1 全量建表 + R__ 导入配置种子，
# 顺带让每个集成测试都验证一次迁移脚本可用
spring.flyway.enabled=true

# 降低日志噪音（测试输出以断言结果为主）
logging.level.com.loan=WARN
logging.level.org.springframework=WARN
logging.level.org.mybatis=WARN

# 加速测试：关闭 devtools
spring.devtools.restart.enabled=false
