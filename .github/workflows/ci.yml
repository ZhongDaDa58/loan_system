name: CI

# 为什么用 GitHub Actions 而不是只有本地 ci.ps1：
#   本地脚本只能保证「我这台机器能构建」。换台机器（或代码被别人接手）就没有保障了。
#   CI 的意义是**把构建标准固化在仓库里**，任何人 push 都会自动验证。
#
# 本项目的 ci.ps1 仍然保留 —— 它多了 `docker build` 和 Windows 环境验证，
# 两者互补：CI 保证"Linux + 干净环境"能过，ci.ps1 保证"本机 + 镜像构建"能过。

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # 支持手动触发（例如想在不提交的情况下验证 CI 是否能过）
  workflow_dispatch:

# 同一分支的新 push 会自动取消上一次未跑完的运行，省 Actions 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 构建 + 测试 + 覆盖率门槛
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ⚠️ 为什么需要这两个 service（第一次跑 CI 时踩的坑）：
    #   项目里有 5 个 @SpringBootTest 类（LoanApplicationTests / SysUserMapperTest /
    #   ScorecardEngineTest / SysUserServiceTest / MultiSourceSyncTest）**不带 Testcontainers**，
    #   它们直接连 application.properties 里配的 localhost:3306 + localhost:6379。
    #   本地之所以能过，是因为开发机上有 MySQL/Redis 在跑；
    #   GitHub runner 上什么都没有 → Spring 上下文起不来 →
    #       'flywayInitializer' ... Unable to obtain connection from database: Communications link failure
    #   而且第一个类失败后会连带后续类报 "ApplicationContext failure threshold exceeded"。
    #
    #   注意：这不是 Testcontainers 的集成测试失败 —— 那两个类是自带容器的，与这里无关。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 114514      # 与 application.properties 的 ${DB_PASSWORD:114514} 对齐
          MYSQL_DATABASE: loan_risk_control # Flyway 会在此库里从 V1 建表，无需手工初始化
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p114514"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        # application.properties 里 spring.cache.type=redis，缺了 Redis 上下文同样起不来
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 缓存 ~/.m2/repository，key 跟 pom.xml 的 hash 绑定
      # pom 变了就重新下载，没变就直接命中（省 1~2 分钟）
      # 注意：actions/cache v4 在 Node 24 runner 上会报 "Node.js 20 deprecated" 警告，
      # 只是警告不影响功能；等 v5 稳定后再升级。
      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # 保险：仓库里的 mvnw 应该已经是 100755，但 clone 后的权限可能被文件系统影响
      - name: 确保 mvnw 可执行
        run: chmod +x mvnw

      # `verify` = compile + test + jacoco:check（覆盖率门槛 25%）
      # 集成测试用 Testcontainers → 需要 Docker。
      # GitHub Actions 的 ubuntu-latest **自带 Docker**，所以会真跑，不会被 disabledWithoutDocker 跳过。
      #
      # 时区显式指定 Asia/Shanghai：集成测试里的日期断言按本地时区写，
      # runner 默认 UTC 会让"今天/明天"类断言在跨零点时失败。
      - name: 构建并运行全部测试（含覆盖率门槛）
        run: ./mvnw -B --no-transfer-progress -Duser.timezone=Asia/Shanghai verify

      # 测试失败时，把失败摘要直接打到日志 —— 否则只能下载 artifact 才知道哪个测试挂了，
      # 排查要多花好几步（第一次跑 CI 时就吃了这个亏）
      - name: 失败时打印失败测试摘要
        if: failure()
        run: |
          echo "========== 失败的测试 =========="
          if ls target/surefire-reports/*.txt >/dev/null 2>&1; then
            grep -l -E "<<< (FAILURE|ERROR)" target/surefire-reports/*.txt | while read f; do
              echo "----- $f -----"
              head -40 "$f"
            done
          else
            echo "(没有 surefire 报告 → 说明失败发生在测试阶段之前，如编译)"
          fi
          echo "========== 报告目录 =========="
          ls -la target/surefire-reports/ 2>/dev/null || echo "(目录不存在)"

      # 测试挂了要能看原因，不然只知道"红了"
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      # 只在 master 分支验证 Dockerfile —— PR 里跳过，避免每次 PR 都多花几分钟
      # 目的：防止 Dockerfile 悄悄腐化（比如依赖的 jar 路径变了却没人发现）
      - name: 验证 Docker 镜像可构建（仅 master）
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: docker build -t loan-app:ci .
